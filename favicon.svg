<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Latar belakang putih rounded agar tidak menjadi hitam saat browser dalam Mode Gelap / Dark Mode -->
  <rect width="512" height="512" rx="128" fill="#FFFFFF"/>
  
  <defs>
    <!-- Gradasi Pelangi Pastel -->
    <linearGradient id="arcTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C3DAFE" />
      <stop offset="50%" stop-color="#E9D8FD" />
      <stop offset="100%" stop-color="#FED7E2" />
    </linearGradient>
    <linearGradient id="arcMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B2F5EA" />
      <stop offset="100%" stop-color="#BEE3F8" />
    </linearGradient>
    <linearGradient id="arcLow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBD38D" />
      <stop offset="100%" stop-color="#FEB2B2" />
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D8FD" />
      <stop offset="100%" stop-color="#FEB2B2" />
    </linearGradient>
  </defs>

  <!-- Ikon WiFi Pastel -->
  <g transform="translate(0, 20)">
    <!-- Lengkungan Atas -->
    <path d="M 80,180 A 200,200 0 0,1 432,180" fill="none" stroke="url(#arcTop)" stroke-width="48" stroke-linecap="round"/>
    <!-- Lengkungan Tengah -->
    <path d="M 136,246 A 136,136 0 0,1 376,246" fill="none" stroke="url(#arcMid)" stroke-width="46" stroke-linecap="round"/>
    <!-- Lengkungan Bawah -->
    <path d="M 192,312 A 72,72 0 0,1 320,312" fill="none" stroke="url(#arcLow)" stroke-width="44" stroke-linecap="round"/>
    <!-- Titik Bawah -->
    <circle cx="256" cy="380" r="26" fill="url(#dotGrad)"/>
  </g>
</svg>
