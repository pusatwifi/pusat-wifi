
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512">

  <defs>
    <!-- Outer arc: pastel purple, pink, blue -->
    <linearGradient id="wifi1"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3B6FF"/>
      <stop offset="50%" stop-color="#C6B5FF"/>
      <stop offset="100%" stop-color="#82C8FF"/>
    </linearGradient>

    <!-- Middle arc: cyan, mint -->
    <linearGradient id="wifi2"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78DFFF"/>
      <stop offset="50%" stop-color="#67D9E8"/>
      <stop offset="100%" stop-color="#8BE8C8"/>
    </linearGradient>

    <!-- Inner arc: yellow, peach, pink -->
    <linearGradient id="wifi3"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE58A"/>
      <stop offset="50%" stop-color="#FFD77A"/>
      <stop offset="100%" stop-color="#FF9DB8"/>
    </linearGradient>

    <!-- Center dot -->
    <linearGradient id="dot"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC2E8"/>
      <stop offset="50%" stop-color="#F59BD6"/>
      <stop offset="100%" stop-color="#A99AFF"/>
    </linearGradient>

    <!-- Soft glow -->
    <filter id="softGlow"
            x="-30%" y="-30%"
            width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background: no background rectangle -->

  <!-- WiFi signal -->
  <g fill="none"
     stroke-linecap="round"
     stroke-width="42"
     filter="url(#softGlow)">

    <!-- Outer arc -->
    <path d="M105 185
             C170 120 342 120 407 185"
          stroke="url(#wifi1)"/>

    <!-- Middle arc -->
    <path d="M145 257
             C193 209 319 209 367 257"
          stroke="url(#wifi2)"/>

    <!-- Inner arc -->
    <path d="M192 328
             C218 303 294 303 320 328"
          stroke="url(#wifi3)"/>
  </g>

  <!-- Center dot -->
  <circle cx="256"
          cy="400"
          r="31"
          fill="url(#dot)"
          filter="url(#softGlow)"/>

</svg>